<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Regalo de cumpleaños interactivo</title>

<style>
  :root{
    --cream:#fff8f3;
    --pink:#ff3f77;
    --deep-pink:#e52b5a;
    --dark:#31191d;
    --gold:#ffc35a;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#fff7f2;
  }

  body{
    font-family: Georgia, "Times New Roman", serif;
    color:#2d2020;
    user-select:none;
    touch-action:none;
  }

  button{
    font:inherit;
  }

  #app{
    position:relative;
    width:100vw;
    height:100dvh;
    min-height:100vh;
    overflow:hidden;
    isolation:isolate;
    background:
      radial-gradient(circle at 25% 70%, rgba(255,211,164,.22), transparent 30%),
      radial-gradient(circle at 84% 30%, rgba(255,154,181,.24), transparent 33%),
      linear-gradient(135deg,#fffdf9 0%,#fff5ef 52%,#fff8ed 100%);
  }

  /* ---------- SCENES ---------- */

  .scene{
    position:absolute;
    inset:0;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:opacity .45s ease;
  }

  .scene.active{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
  }

  /* subtle paper/grain */
  .scene::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:.075;
    mix-blend-mode:multiply;
    background-image:
      repeating-radial-gradient(circle at 20% 20%,
        rgba(80,30,30,.32) 0 0.6px,
        transparent .8px 3px);
    background-size:6px 6px;
    z-index:60;
  }

  /* ---------- SCENE 1 ---------- */

  #scene1{
    background:
      radial-gradient(circle at 67% 35%, rgba(255,90,138,.27) 0 8%, rgba(255,126,164,.12) 18%, transparent 36%),
      radial-gradient(circle at 45% 100%, rgba(255,211,164,.25), transparent 30%),
      linear-gradient(120deg,#fffaf7 0%,#fff6ef 52%,#fffaf2 100%);
  }

  .intro-note{
    position:absolute;
    top:16%;
    left:67%;
    width:250px;
    transform:translateX(-50%);
    text-align:center;
    font-style:italic;
    font-size:clamp(13px,1.25vw,19px);
    letter-spacing:.025em;
    color:#5d3d42;
    opacity:.84;
  }

  /* Corazón objetivo: SVG vertical, simétrico y con volumen */
  .heart-target{
    position:absolute;
    left:67%;
    top:34%;
    width:clamp(92px,10.5vw,154px);
    aspect-ratio:180 / 170;
    transform:translate(-50%,-50%) scale(1);
    z-index:8;
    filter:
      drop-shadow(0 17px 12px rgba(176,31,71,.18))
      drop-shadow(0 0 26px rgba(255,67,119,.30));
    transition:filter .22s ease;
    will-change:transform,filter;
  }

  .heart-svg{
    display:block;
    width:100%;
    height:100%;
    overflow:visible;
    transform-origin:50% 54%;
    animation:heartFloat 3.1s ease-in-out infinite;
  }

  .heart-body{
    stroke:rgba(181,25,67,.27);
    stroke-width:1.4;
    paint-order:stroke fill;
  }

  .heart-rim{
    fill:none;
    stroke:rgba(255,255,255,.26);
    stroke-width:2.1;
    stroke-linecap:round;
    opacity:.82;
  }

  .heart-highlight-main{
    fill:none;
    stroke:rgba(255,255,255,.88);
    stroke-width:7;
    stroke-linecap:round;
    filter:blur(.2px);
    opacity:.92;
  }

  .heart-highlight-soft{
    fill:rgba(255,255,255,.72);
    filter:blur(1px);
  }

  .heart-gloss{
    fill:url(#heartGloss);
    opacity:.72;
    mix-blend-mode:screen;
  }

  .heart-bottom-shade{
    fill:url(#heartBottomShade);
    opacity:.56;
  }

  .heart-sparkle{
    fill:#fff;
    opacity:.84;
    filter:drop-shadow(0 0 3px rgba(255,255,255,.95));
    animation:heartSparkle 2.2s ease-in-out infinite;
  }

  @keyframes heartFloat{
    0%,100%{transform:translateY(0) rotate(-.4deg)}
    50%{transform:translateY(-4px) rotate(.4deg)}
  }

  @keyframes heartSparkle{
    0%,55%,100%{opacity:.34;transform:scale(.8)}
    68%{opacity:1;transform:scale(1.18)}
  }

  .heart-target.hit{
    filter:
      drop-shadow(0 14px 12px rgba(176,31,71,.18))
      drop-shadow(0 0 42px rgba(255,53,109,.62));
    animation:heartHit .52s cubic-bezier(.18,.88,.25,1);
  }

  .heart-target.hit .heart-svg{
    animation:none;
  }

  @keyframes heartHit{
    0%{transform:translate(-50%,-50%) scale(1,1)}
    16%{transform:translate(-50%,-50%) scale(.88,1.08)}
    38%{transform:translate(-50%,-50%) scale(1.11,.91)}
    64%{transform:translate(-50%,-50%) scale(.97,1.03)}
    100%{transform:translate(-50%,-50%) scale(1,1)}
  }

  .heart-target.morph{
    animation:morphHeart .72s forwards cubic-bezier(.5,0,.2,1);
  }

  .heart-target.morph .heart-svg{
    animation:none;
  }

  @keyframes morphHeart{
    0%{
      transform:translate(-50%,-50%) scale(1);
      filter:drop-shadow(0 0 30px rgba(255,48,101,.42));
      opacity:1;
    }
    45%{
      transform:translate(-50%,-50%) scale(.72);
      filter:drop-shadow(0 0 54px rgba(255,48,101,.76));
      opacity:1;
    }
    100%{
      transform:translate(-50%,-50%) scale(.035);
      filter:drop-shadow(0 0 88px rgba(255,48,101,1));
      opacity:.92;
    }
  }

  .impact-spark{
    position:absolute;
    left:67%;
    top:34%;
    z-index:20;
    pointer-events:none;
  }

  .impact-spark i{
    position:absolute;
    width:8px;
    height:8px;
    border-radius:2px 60% 2px 60%;
    background:var(--c,#ffcf57);
    opacity:0;
  }

  .impact-spark.go i{
    animation:sparkBurst .72s ease-out forwards;
    animation-delay:var(--d);
  }

  @keyframes sparkBurst{
    0%{opacity:0;transform:translate(0,0) rotate(0) scale(.3)}
    20%{opacity:1}
    100%{
      opacity:0;
      transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(1.2);
    }
  }

  #bowRig{
    position:absolute;
    left:13%;
    top:60%;
    width:clamp(155px,17vw,235px);
    aspect-ratio:300 / 260;
    /* El arco gira alrededor de la empuñadura real (x=110,y=130). */
    transform-origin:36.6667% 50%;
    z-index:15;
    cursor:grab;
    overflow:visible;
    touch-action:none;
    will-change:transform;
  }

  #bowRig.aiming{ cursor:grabbing; }

  #bowSvg{
    width:100%;
    height:100%;
    overflow:visible;
    filter:drop-shadow(0 7px 7px rgba(62,32,18,.15));
  }

  .bow-limb{
    fill:none;
    stroke:url(#woodGrad);
    stroke-width:9.5;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  .bow-edge{
    fill:none;
    stroke:rgba(255,220,166,.46);
    stroke-width:2.25;
    stroke-linecap:round;
    pointer-events:none;
  }

  .bow-string{
    fill:none;
    stroke:#5c4b43;
    stroke-width:1.9;
    stroke-linecap:round;
    vector-effect:non-scaling-stroke;
  }

  .bow-grip{
    fill:url(#gripGrad);
    stroke:#37251f;
    stroke-width:2;
  }

  .bow-wrap{
    fill:none;
    stroke:#da3e61;
    stroke-width:3;
    stroke-linecap:round;
  }

  .arrow-shaft{
    stroke:url(#shaftGrad);
    stroke-width:3.1;
    stroke-linecap:round;
  }

  .arrow-tip{
    fill:#55443d;
    stroke:#302722;
    stroke-width:.7;
  }

  .arrow-feather{ fill:#ee4769; }

  .arrow-feather-light{ fill:#ff809b; }

  .nock-handle{
    fill:#ff5579;
    stroke:#fff4ef;
    stroke-width:3;
    filter:drop-shadow(0 0 7px rgba(240,61,103,.45));
    transform-origin:center;
    animation:nockPulse 1.6s ease-in-out infinite;
  }

  #bowRig.aiming .nock-handle{ animation:none; }

  @keyframes nockPulse{
    0%,100%{transform:scale(.78);opacity:.72}
    50%{transform:scale(1.08);opacity:1}
  }

  .draw-guide{
    fill:none;
    stroke:#e95a79;
    stroke-width:1.4;
    stroke-dasharray:3 5;
    opacity:0;
    transition:opacity .18s ease;
  }

  #bowRig.aiming .draw-guide{ opacity:.42; }

  .hint{
    position:absolute;
    left:50%;
    bottom:5.6%;
    transform:translateX(-50%);
    font-family:Arial,sans-serif;
    font-size:clamp(10px,.85vw,13px);
    letter-spacing:.13em;
    text-transform:uppercase;
    color:rgba(82,51,48,.58);
    transition:opacity .3s ease;
    text-align:center;
    white-space:nowrap;
  }

  .hint b{ color:#df4068; font-weight:700; }

  .draw-status{
    position:absolute;
    left:50%;
    bottom:10%;
    transform:translateX(-50%) translateY(5px);
    z-index:18;
    font-family:Arial,sans-serif;
    font-size:10px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:#c63c60;
    opacity:0;
    transition:.18s ease;
    pointer-events:none;
  }

  .draw-status.show{
    opacity:.72;
    transform:translateX(-50%) translateY(0);
  }

  /* Flecha que se desprende del arco al soltar. */
  .hit-arrow{
    position:absolute;
    left:0;
    top:0;
    width:116px;
    height:24px;
    opacity:0;
    z-index:19;
    pointer-events:none;
    transform-origin:10px 12px;
    will-change:transform;
  }

  .hit-arrow .fa-shaft{
    position:absolute;
    left:9px;
    top:10.5px;
    width:91px;
    height:3px;
    border-radius:99px;
    background:linear-gradient(90deg,#b1843e,#8c682f 62%,#684c29);
    box-shadow:0 1px 1px rgba(68,42,23,.12);
  }

  .hit-arrow .fa-head{
    position:absolute;
    left:97px;
    top:5px;
    width:0;
    height:0;
    border-top:7px solid transparent;
    border-bottom:7px solid transparent;
    border-left:16px solid #4d403a;
    filter:drop-shadow(1px 1px 0 rgba(0,0,0,.08));
  }

  .hit-arrow .fa-feather{
    position:absolute;
    width:18px;
    height:7px;
    left:7px;
    border-radius:80% 10% 80% 10%;
    background:#ef496b;
    transform-origin:right center;
  }

  .hit-arrow .fa-feather.one{ top:4px; transform:rotate(18deg); }
  .hit-arrow .fa-feather.two{ top:13px; transform:rotate(-18deg); background:#ff7994; }

  .pink-orb{
    position:absolute;
    left:67%;
    top:34%;
    width:44px;
    height:44px;
    border-radius:50%;
    transform:translate(-50%,-50%) scale(0);
    background:
      radial-gradient(circle at 34% 28%, #ff9db7 0 9%, #f33b72 38%, #da285b 100%);
    box-shadow:0 10px 22px rgba(190,21,67,.24), 0 0 38px rgba(255,61,116,.32);
    z-index:12;
  }

  .pink-orb.go{
    animation:orbDrop .66s cubic-bezier(.35,.01,.55,1) forwards;
  }

  @keyframes orbDrop{
    0%{ transform:translate(-50%,-50%) scale(.25); }
    20%{ transform:translate(-50%,-50%) scale(1); }
    100%{ top:75%; transform:translate(-50%,-50%) scale(1.05); }
  }

  .wash{
    position:absolute;
    left:67%;
    top:75%;
    width:30px;height:30px;
    border-radius:50%;
    background:#e92e60;
    transform:translate(-50%,-50%) scale(0);
    z-index:55;
    pointer-events:none;
  }

  .wash.go{
    animation:washScreen .72s cubic-bezier(.55,.02,.25,1) forwards;
  }

  @keyframes washScreen{
    to{ transform:translate(-50%,-50%) scale(70); }
  }

  /* ---------- SCENE 2 ---------- */

  #scene2{
    background:
      radial-gradient(circle at 18% 28%,rgba(255,115,147,.85),transparent 28%),
      radial-gradient(circle at 82% 72%,rgba(202,0,57,.32),transparent 38%),
      linear-gradient(112deg,#f84375,#e82c5e 53%,#df2857);
  }

  #scene2::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(100deg,rgba(255,255,255,.18),transparent 22%,transparent 70%,rgba(97,0,30,.09));
    z-index:1;
  }

  .letterbox{
    position:absolute;
    left:0;right:0;
    height:12.3%;
    background:#17080d;
    z-index:3;
    transform:scaleY(0);
  }

  .letterbox.top{ top:0; transform-origin:top; }
  .letterbox.bottom{ bottom:0; transform-origin:bottom; }

  #scene2.active .letterbox{
    animation:barIn .45s .15s forwards ease;
  }

  @keyframes barIn{to{transform:scaleY(1)}}

  .birthday-card{
    position:absolute;
    inset:12.3% 0;
    z-index:5;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    overflow:hidden;
  }

  .wish{
    position:absolute;
    top:8%;
    font-style:italic;
    font-size:clamp(11px,1vw,17px);
    color:#ffe9df;
    letter-spacing:.08em;
    opacity:0;
    transform:translateY(-8px);
  }

  #scene2.active .wish{
    animation:softIn .8s .45s forwards ease;
  }

  .big-title{
    position:relative;
    margin:0;
    color:#fff6eb;
    font-weight:700;
    font-size:clamp(56px,9vw,150px);
    line-height:.82;
    letter-spacing:-.055em;
    text-shadow:0 5px 12px rgba(103,0,28,.11);
  }

  .big-title .line{
    display:block;
    clip-path:inset(0 100% 0 0);
    transform:translateY(18px);
  }

  #scene2.active .big-title .line.one{
    animation:titleReveal .8s .62s cubic-bezier(.18,.75,.2,1) forwards;
  }

  #scene2.active .big-title .line.two{
    animation:titleReveal .92s .95s cubic-bezier(.18,.75,.2,1) forwards;
  }

  @keyframes titleReveal{
    to{clip-path:inset(0 0 0 0);transform:translateY(0)}
  }

  .swoosh{
    width:min(300px,28vw);
    height:22px;
    margin-top:16px;
    opacity:0;
  }

  #scene2.active .swoosh{
    animation:softIn .5s 1.72s forwards;
  }

  .swoosh path{
    stroke-dasharray:500;
    stroke-dashoffset:500;
  }

  #scene2.active .swoosh path{
    animation:drawSwoosh .7s 1.68s forwards ease;
  }

  @keyframes drawSwoosh{to{stroke-dashoffset:0}}

  .celebrate{
    margin-top:8px;
    color:#ffe5dc;
    font-size:clamp(10px,.9vw,15px);
    font-style:italic;
    letter-spacing:.04em;
    opacity:0;
  }

  #scene2.active .celebrate{
    animation:softIn .6s 2s forwards;
  }

  @keyframes softIn{
    to{opacity:1;transform:translateY(0)}
  }

  .scene2-flare{
    position:absolute;
    left:76%;
    top:56%;
    width:50px;height:50px;
    border-radius:50%;
    z-index:50;
    opacity:0;
    background:#fffbe5;
    box-shadow:
      0 0 28px 18px rgba(255,249,216,.98),
      0 0 85px 48px rgba(255,224,168,.82),
      0 0 150px 90px rgba(255,187,100,.34);
    pointer-events:none;
  }

  .scene2-flare.go{
    animation:flareOut .78s forwards ease-in;
  }

  @keyframes flareOut{
    0%{opacity:0;transform:scale(.15)}
    20%{opacity:1}
    100%{opacity:1;transform:scale(38)}
  }

  /* ---------- SCENE 3 ---------- */

  #scene3{
    background:
      radial-gradient(circle at 79% 22%, rgba(255,255,255,.94), transparent 28%),
      radial-gradient(circle at 20% 34%, rgba(255,235,208,.82), transparent 34%),
      radial-gradient(circle at 65% 84%, rgba(255,224,167,.35), transparent 28%),
      linear-gradient(120deg,#fff8ee 0%,#fffaf1 48%,#fff5e9 100%);
  }

  .bokeh{
    position:absolute;
    inset:0;
    overflow:hidden;
    z-index:1;
    pointer-events:none;
  }

  .bokeh i{
    position:absolute;
    border-radius:50%;
    background:rgba(255,223,182,.25);
    filter:blur(2px);
    animation:bokehFloat 8s ease-in-out infinite alternate;
  }

  @keyframes bokehFloat{
    to{transform:translate(22px,-18px) scale(1.15)}
  }

  .final-copy{
    position:absolute;
    left:4%;
    bottom:8%;
    z-index:12;
    color:#51423c;
    opacity:0;
    transform:translateY(12px);
  }

  #scene3.copy-on .final-copy{
    animation:copyIn .8s forwards ease;
  }

  @keyframes copyIn{to{opacity:1;transform:translateY(0)}}

  .final-small{
    font-size:clamp(12px,1.05vw,17px);
    font-style:italic;
    letter-spacing:.04em;
  }

  .final-script{
    display:block;
    margin-top:0;
    margin-left:-4px;
    font-family:"Brush Script MT","Segoe Script","Lucida Handwriting",cursive;
    font-size:clamp(42px,6.6vw,104px);
    line-height:.92;
    color:#d93163;
    text-shadow:0 2px 0 rgba(255,255,255,.65);
    white-space:nowrap;
  }

  .final-foot{
    margin-top:6px;
    font-size:clamp(9px,.72vw,12px);
    color:#7b6860;
    letter-spacing:.02em;
  }

  .tree-wrap{
    position:absolute;
    inset:0;
    z-index:6;
  }

  #treeSvg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:visible;
  }

  .branch{
    fill:none;
    stroke:#643c3a;
    stroke-linecap:round;
    stroke-linejoin:round;
    filter:drop-shadow(0 2px 1px rgba(84,41,38,.08));
  }

  .branch.main{stroke-width:15}
  .branch.mid{stroke-width:8.5}
  .branch.small{stroke-width:5}

  .branch{
    stroke-dasharray:var(--len,900);
    stroke-dashoffset:var(--len,900);
  }

  #scene3.grow .branch{
    animation:growBranch var(--dur,1s) var(--delay,0s) forwards ease-out;
  }

  @keyframes growBranch{to{stroke-dashoffset:0}}

  #blossoms{
    position:absolute;
    inset:0;
    z-index:10;
    pointer-events:none;
  }

  .blossom{
    position:absolute;
    width:var(--s);
    height:var(--s);
    transform:translate(-50%,-50%) scale(0) rotate(var(--rot));
    opacity:0;
    filter:drop-shadow(0 3px 3px rgba(180,54,91,.12));
  }

  .blossom.heart{
    background:var(--bc);
    transform:translate(-50%,-50%) scale(0) rotate(calc(-45deg + var(--rot)));
    border-radius:4px 11px 4px 8px;
  }

  .blossom.heart::before,
  .blossom.heart::after{
    content:"";
    position:absolute;
    width:100%;height:100%;
    background:inherit;
    border-radius:50%;
  }

  .blossom.heart::before{left:50%;top:0}
  .blossom.heart::after{left:0;top:-50%}

  .blossom.dot{
    border-radius:50%;
    background:
      radial-gradient(circle at 36% 28%,rgba(255,255,255,.7) 0 13%,transparent 15%),
      var(--bc);
  }

  .blossom.pop{
    animation:bloomPop .68s var(--bd,0s) cubic-bezier(.2,.9,.2,1.2) forwards;
  }

  @keyframes bloomPop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(0) rotate(var(--rot))}
    55%{opacity:1;transform:translate(-50%,-50%) scale(1.25) rotate(var(--rot))}
    100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(var(--rot))}
  }

  .blossom.heart.pop{
    animation:bloomHeart .68s var(--bd,0s) cubic-bezier(.2,.9,.2,1.2) forwards;
  }

  @keyframes bloomHeart{
    0%{opacity:0;transform:translate(-50%,-50%) scale(0) rotate(calc(-45deg + var(--rot)))}
    55%{opacity:1;transform:translate(-50%,-50%) scale(1.25) rotate(calc(-45deg + var(--rot)))}
    100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(calc(-45deg + var(--rot)))}
  }

  .petal{
    position:absolute;
    z-index:14;
    width:10px;height:14px;
    border-radius:70% 20% 70% 20%;
    background:rgba(245,105,139,.42);
    pointer-events:none;
    opacity:0;
    animation:petalFall var(--pd,7s) var(--pdelay,0s) linear infinite;
  }

  @keyframes petalFall{
    0%{opacity:0;transform:translate(0,-8vh) rotate(0)}
    12%{opacity:.75}
    100%{opacity:0;transform:translate(var(--px),108vh) rotate(630deg)}
  }


  /* ---------- FOTOS / RECUERDOS FLOTANDO ---------- */

  .memory-rain{
    position:absolute;
    inset:0;
    z-index:3; /* detrás del árbol (z-index 6) */
    overflow:hidden;
    pointer-events:none;
  }

  .memory-photo{
    position:absolute;
    top:-42vh;
    left:var(--left);
    width:var(--mw);
    max-width:175px;
    opacity:0;
    border-radius:18px;
    object-fit:cover;

    /* aspecto suave y de fondo */
    filter:
      saturate(.82)
      contrast(.94)
      brightness(1.03)
      blur(.25px);

    box-shadow:
      0 10px 30px rgba(113,64,57,.10),
      0 2px 8px rgba(113,64,57,.07);

    /* difumina los bordes de cada fotografía */
    -webkit-mask-image:
      radial-gradient(
        ellipse at center,
        #000 0%,
        #000 55%,
        rgba(0,0,0,.88) 67%,
        rgba(0,0,0,.28) 87%,
        transparent 100%
      );
    mask-image:
      radial-gradient(
        ellipse at center,
        #000 0%,
        #000 55%,
        rgba(0,0,0,.88) 67%,
        rgba(0,0,0,.28) 87%,
        transparent 100%
      );

    transform:
      translate3d(0,-12vh,0)
      rotate(var(--r0))
      scale(var(--scale));

    animation:
      memoryPhotoFall var(--fall-time)
      var(--delay)
      linear infinite;

    will-change:transform,opacity;
  }

  @keyframes memoryPhotoFall{
    0%{
      opacity:0;
      transform:
        translate3d(0,-15vh,0)
        rotate(var(--r0))
        scale(var(--scale));
    }

    10%{
      opacity:var(--photo-opacity);
    }

    48%{
      opacity:var(--photo-opacity);
      transform:
        translate3d(var(--drift-mid),66vh,0)
        rotate(var(--r1))
        scale(calc(var(--scale) * 1.015));
    }

    84%{
      opacity:calc(var(--photo-opacity) * .78);
    }

    100%{
      opacity:0;
      transform:
        translate3d(var(--drift-end),152vh,0)
        rotate(var(--r2))
        scale(calc(var(--scale) * .98));
    }
  }

  /* Una segunda capa muy tenue para dar profundidad */
  .memory-photo.far{
    filter:
      saturate(.70)
      contrast(.92)
      brightness(1.08)
      blur(1.1px);
  }

  @media (max-width:700px){
    .memory-photo{
      max-width:112px;
      border-radius:13px;
    }
  }

  /* ---------- UI ---------- */

  .replay{
    position:absolute;
    right:22px;
    bottom:20px;
    z-index:100;
    border:1px solid rgba(95,53,52,.18);
    background:rgba(255,255,255,.67);
    color:#77414f;
    border-radius:999px;
    padding:10px 16px;
    cursor:pointer;
    backdrop-filter:blur(8px);
    box-shadow:0 6px 22px rgba(85,39,48,.08);
    opacity:0;
    pointer-events:none;
    transform:translateY(8px);
    transition:.25s ease;
    font-family:Arial,sans-serif;
    font-size:12px;
    letter-spacing:.07em;
  }

  .replay.show{
    opacity:1;
    pointer-events:auto;
    transform:translateY(0);
  }

  .replay:hover{transform:translateY(-2px)}

  .screen-flash{
    position:absolute;
    inset:0;
    z-index:95;
    background:#fff7e8;
    opacity:0;
    pointer-events:none;
  }

  .screen-flash.go{
    animation:screenFlash .55s forwards ease;
  }

  @keyframes screenFlash{
    0%{opacity:0}
    35%{opacity:1}
    100%{opacity:0}
  }

  @media (max-width:700px){
    .intro-note{top:15%;left:69%;width:180px}
    .heart-target{left:68%;top:32%;width:95px}
    #bowRig{left:4%;top:62%;width:155px}
    .final-copy{left:4%;bottom:6%}
    .final-script{font-size:12vw}
    .birthday-card{inset:11% 0}
    .letterbox{height:11%}
  }


  /* =========================================================
     AJUSTES ESPECÍFICOS PARA TELÉFONO
     ========================================================= */

  html, body, #app{
    width:100%;
    height:100%;
    min-height:100%;
  }

  body{
    overscroll-behavior:none;
    -webkit-overflow-scrolling:touch;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
  }

  @supports (height:100dvh){
    #app{
      height:100dvh;
      min-height:100dvh;
    }
  }

  @media (max-width:700px){

    /* ---------- ESCENA 1 / ARCO ---------- */

    .intro-note{
      top:max(6.5%, calc(env(safe-area-inset-top) + 14px));
      left:50%;
      width:88vw;
      transform:translateX(-50%);
      font-size:14px;
      line-height:1.35;
    }

    .heart-target{
      left:69%;
      top:25%;
      width:clamp(88px,25vw,108px);
    }

    #bowRig{
      left:1.5vw;
      top:56%;
      width:clamp(168px,47vw,205px);
      min-width:168px;
    }

    /*
      En teléfono se puede comenzar el gesto tocando cualquier parte
      del arco; esto hace mucho más fácil agarrar la cuerda con el dedo.
    */
    #bowRig::after{
      content:"";
      position:absolute;
      inset:-20px -25px;
      border-radius:30px;
      background:transparent;
      pointer-events:auto;
    }

    .nock-handle{
      stroke-width:4;
      filter:drop-shadow(0 0 10px rgba(240,61,103,.58));
    }

    .draw-status{
      bottom:calc(env(safe-area-inset-bottom) + 70px);
      width:86vw;
      font-size:11px;
      text-align:center;
      white-space:normal;
    }

    .hint{
      bottom:calc(env(safe-area-inset-bottom) + 19px);
      width:88vw;
      max-width:420px;
      padding:0 10px;
      font-size:10px;
      line-height:1.45;
      letter-spacing:.105em;
      white-space:normal;
    }

    /* ---------- ESCENA 2 / FELIZ CUMPLEAÑOS ---------- */

    .letterbox{
      height:8.5%;
    }

    .birthday-card{
      inset:8.5% 0;
      padding:0 4vw;
    }

    .wish{
      top:12%;
      width:90%;
      font-size:13px;
    }

    .big-title{
      width:100%;
      font-size:clamp(45px,15.3vw,75px);
      line-height:.9;
      letter-spacing:-.045em;
    }

    .big-title .line{
      max-width:100%;
    }

    .swoosh{
      width:min(245px,66vw);
      margin-top:15px;
    }

    .celebrate{
      width:88vw;
      margin-top:12px;
      font-size:12px;
      line-height:1.4;
    }

    .scene2-flare{
      left:70%;
      top:57%;
    }

    /* ---------- ESCENA 3 / ÁRBOL ---------- */

    .tree-wrap{
      inset:4% 0 0;
    }

    #treeSvg{
      transform-origin:50% 100%;
    }

    .final-copy{
      left:5vw;
      right:5vw;
      bottom:calc(env(safe-area-inset-bottom) + 6.2%);
      max-width:90vw;
    }

    .final-small{
      font-size:12px;
    }

    .final-script{
      margin-left:-2px;
      max-width:90vw;
      font-size:clamp(42px,13.2vw,64px);
      line-height:.94;
      white-space:normal;
    }

    .final-foot{
      max-width:82vw;
      font-size:10px;
      line-height:1.35;
    }

    .memory-photo{
      max-width:96px;
      border-radius:12px;
      box-shadow:0 6px 20px rgba(113,64,57,.08);
    }

    .petal{
      width:7px;
      height:10px;
    }

    .replay{
      right:calc(env(safe-area-inset-right) + 12px);
      bottom:calc(env(safe-area-inset-bottom) + 12px);
      padding:9px 13px;
      font-size:11px;
    }
  }

  /*
    Teléfonos estrechos: evitamos que arco y corazón se salgan
    incluso en dispositivos de 320-360 px.
  */
  @media (max-width:380px) and (orientation:portrait){
    .heart-target{
      left:70%;
      top:24%;
      width:86px;
    }

    #bowRig{
      left:-1vw;
      top:57%;
      width:166px;
    }

    .big-title{
      font-size:clamp(42px,15vw,59px);
    }

    .final-script{
      font-size:12vw;
    }
  }

  /* También funciona al girar el teléfono. */
  @media (max-height:500px) and (orientation:landscape){
    .intro-note{
      top:5%;
      left:55%;
      width:300px;
    }

    .heart-target{
      left:72%;
      top:34%;
      width:82px;
    }

    #bowRig{
      left:6%;
      top:42%;
      width:150px;
    }

    .hint{
      bottom:8px;
      font-size:9px;
    }

    .draw-status{
      bottom:42px;
    }

    .big-title{
      font-size:clamp(45px,10vw,72px);
    }

    .final-copy{
      bottom:5%;
    }

    .final-script{
      font-size:clamp(36px,8vw,60px);
      white-space:nowrap;
    }
  }

  @media (prefers-reduced-motion:reduce){
    *{scroll-behavior:auto}
  }
</style>
</head>

<body>
<div id="app">

<script>
(() => {
  const scene1 = document.getElementById('scene1');
  const scene2 = document.getElementById('scene2');
  const scene3 = document.getElementById('scene3');

  const bowRig = document.getElementById('bowRig');
  const bowSvg = document.getElementById('bowSvg');
  const bowBody = document.getElementById('bowBody');
  const bowEdge = document.getElementById('bowEdge');
  const bowString = document.getElementById('bowString');
  const arrowGroup = document.getElementById('arrowGroup');
  const arrowShaft = document.getElementById('arrowShaft');
  const arrowTip = document.getElementById('arrowTip');
  const featherOne = document.getElementById('featherOne');
  const featherTwo = document.getElementById('featherTwo');
  const nockHandle = document.getElementById('nockHandle');
  const heart = document.getElementById('heartTarget');
  const impactSpark = document.getElementById('impactSpark');
  const hitArrow = document.getElementById('hitArrow');
  const orb = document.getElementById('orb');
  const wash = document.getElementById('wash');
  const hint = document.getElementById('hint');
  const drawStatus = document.getElementById('drawStatus');

  const scene2Flare = document.getElementById('scene2Flare');
  const screenFlash = document.getElementById('screenFlash');
  const blossoms = document.getElementById('blossoms');
  const replay = document.getElementById('replay');
  const treeSvg = document.getElementById('treeSvg');

  let aiming = false;
  let fired = false;
  let currentAngle = -24;
  let pull = 0;
  let activePointerId = null;
  let flightAnimation = null;
  let timers = [];
  let petalNodes = [];
  let memoryPhotoNodes = [];

  const later = (fn, ms) => {
    const id = setTimeout(fn, ms);
    timers.push(id);
    return id;
  };

  function clearTimers(){
    timers.forEach(clearTimeout);
    timers = [];
  }


  const isPhone = () => window.matchMedia('(max-width:700px)').matches;

  function applyResponsiveLayout(){
    if(isPhone()){
      /*
        En escritorio el SVG se muestra a lo ancho.
        En vertical usamos una ventana más cerrada y "meet" para que
        ninguna rama importante desaparezca fuera de la pantalla.
      */
      treeSvg.setAttribute('viewBox','520 72 590 690');
      treeSvg.setAttribute('preserveAspectRatio','xMidYMax meet');
    }else{
      treeSvg.setAttribute('viewBox','0 0 1200 700');
      treeSvg.setAttribute('preserveAspectRatio','xMidYMid slice');
    }
  }

  function makeImpactSparks(){
    impactSpark.innerHTML = '';
    const colors = ['#ffcf55','#ff7197','#f34473','#ffc46e','#f394b2'];
    const sparkCount = isPhone() ? 10 : 15;
    for(let i=0;i<sparkCount;i++){
      const el = document.createElement('i');
      const ang = Math.random()*Math.PI*2;
      const dist = 28 + Math.random()*72;
      el.style.setProperty('--x', `${Math.cos(ang)*dist}px`);
      el.style.setProperty('--y', `${Math.sin(ang)*dist}px`);
      el.style.setProperty('--r', `${-100 + Math.random()*200}deg`);
      el.style.setProperty('--d', `${Math.random()*.14}s`);
      el.style.setProperty('--c', colors[i%colors.length]);
      impactSpark.appendChild(el);
    }
  }

  const clamp = (v,min,max) => Math.max(min,Math.min(max,v));

  function angleDelta(a,b){
    let d=(a-b)%360;
    if(d>180)d-=360;
    if(d<-180)d+=360;
    return d;
  }

  function svgPointToScreen(x,y){
    const pt = bowSvg.createSVGPoint();
    pt.x=x; pt.y=y;
    return pt.matrixTransform(bowSvg.getScreenCTM());
  }

  function gripPoint(){
    return svgPointToScreen(110,130);
  }

  function targetAngle(){
    const g=gripPoint();
    const hr=heart.getBoundingClientRect();
    return Math.atan2((hr.top+hr.height*.52)-g.y,(hr.left+hr.width*.50)-g.x)*180/Math.PI;
  }

  function setBow(angle=currentAngle, amount=pull){
    currentAngle = angle;
    pull = clamp(amount,0,1);
    bowRig.style.transform = `rotate(${currentAngle}deg)`;

    // Nock: de 78 (reposo) hasta 20 (tensión máxima).
    const nockX = 78 - pull*58;

    // Las puntas del arco ceden hacia el arquero al aumentar la tensión.
    const tipX = 78 - pull*10;
    const shoulder = 109 - pull*5;
    const belly = 118 - pull*3;

    bowBody.setAttribute('d',
      `M${tipX} 25 C${100-pull*3} 46 ${belly} 86 ${shoulder} 116 `+
      `C${105-pull*2} 126 ${105-pull*2} 134 ${shoulder} 144 `+
      `C${belly+1} 174 ${101-pull*3} 215 ${tipX} 235`);

    bowEdge.setAttribute('d',
      `M${tipX+2} 29 C${98-pull*3} 50 ${112-pull*3} 87 ${105-pull*3} 115 `+
      `M${105-pull*3} 145 C${113-pull*3} 175 ${99-pull*3} 211 ${tipX+2} 231`);

    bowString.setAttribute('d', `M${tipX} 25 L${nockX} 130 L${tipX} 235`);

    arrowShaft.setAttribute('x1',nockX);
    arrowShaft.setAttribute('x2',255);
    arrowTip.setAttribute('points','268,130 251,122 254,138');

    const fShift=nockX-78;
    featherOne.setAttribute('transform',`translate(${fShift} 0)`);
    featherTwo.setAttribute('transform',`translate(${fShift} 0)`);
    nockHandle.setAttribute('cx',nockX);

    drawStatus.textContent = pull < .18 ? 'tira de la cuerda' :
                             pull < .55 ? 'un poco más...' :
                             pull < .88 ? 'buena tensión' : '¡suelta!';
  }

  function initialAim(){
    // Esperamos a que el layout exista; el arco queda apuntando al corazón desde el inicio.
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        const a=targetAngle();
        setBow(a,0);
      });
    });
  }

  function pointerToDraw(e){
    const g=gripPoint();
    const dx=g.x-e.clientX;
    const dy=g.y-e.clientY;
    const distance=Math.hypot(dx,dy);
    const scale=Math.max(.35,bowSvg.getBoundingClientRect().width/300);
    const idle=(isPhone()?22:32)*scale;
    const full=(isPhone()?82:92)*scale;
    const amount=clamp((distance-idle)/(full-idle),0,1);
    const angle=Math.atan2(dy,dx)*180/Math.PI;
    return {amount,angle};
  }

  function startDraw(e){
    if(fired) return;
    aiming=true;
    activePointerId=e.pointerId;
    bowRig.classList.add('aiming');
    drawStatus.classList.add('show');
    hint.style.opacity=.28;
    bowRig.setPointerCapture?.(e.pointerId);
    const d=pointerToDraw(e);
    setBow(d.angle,Math.max(.08,d.amount));
    e.preventDefault();
  }

  function moveDraw(e){
    if(!aiming || fired || (activePointerId!==null && e.pointerId!==activePointerId)) return;
    const d=pointerToDraw(e);
    setBow(d.angle,d.amount);
    e.preventDefault();
  }

  function releaseArrow(e){
    if(!aiming || fired || (activePointerId!==null && e.pointerId!==activePointerId)) return;
    aiming=false;
    activePointerId=null;
    bowRig.classList.remove('aiming');
    drawStatus.classList.remove('show');

    // Un arco real no dispara con la cuerda prácticamente sin tensar.
    if(pull < .18){
      const a=currentAngle;
      bowRig.animate([
        {transform:`rotate(${a}deg)`},
        {transform:`rotate(${a-.8}deg)`},
        {transform:`rotate(${a}deg)`}
      ],{duration:180,easing:'ease-out'});
      setBow(a,0);
      hint.style.opacity=1;
      return;
    }

    fire(currentAngle,pull);
  }

  bowRig.addEventListener('pointerdown',startDraw);
  bowRig.addEventListener('pointermove',moveDraw);
  bowRig.addEventListener('pointerup',releaseArrow);
  bowRig.addEventListener('pointercancel',releaseArrow);

  function resetBowForRetry(){
    arrowGroup.style.opacity='1';
    hitArrow.style.opacity='0';
    hitArrow.style.transform='';
    flightAnimation?.cancel?.();
    flightAnimation=null;
    fired=false;
    hint.innerHTML='<b>inténtalo otra vez</b> · apunta al corazón';
    hint.style.opacity=1;
    setBow(targetAngle(),0);
  }

  function fire(angle,power){
    if(fired) return;
    fired=true;
    hint.style.opacity=0;

    const nockX=78-pull*58;
    const start=svgPointToScreen(nockX,130);
    const hr=heart.getBoundingClientRect();
    const target={x:hr.left+hr.width*.5,y:hr.top+hr.height*.52};
    const perfectAngle=Math.atan2(target.y-start.y,target.x-start.x)*180/Math.PI;
    const delta=Math.abs(angleDelta(angle,perfectAngle));

    // Pequeña asistencia de puntería para que la experiencia no resulte frustrante.
    const willHit = delta <= 17;
    const shotAngle = willHit ? perfectAngle : angle;
    const rad=shotAngle*Math.PI/180;
    const ux=Math.cos(rad), uy=Math.sin(rad);

    // La cuerda y las palas recuperan su forma con un pequeño latigazo.
    const releaseAngle=currentAngle;
    setBow(releaseAngle,0);
    bowRig.animate([
      {transform:`rotate(${releaseAngle}deg)`},
      {transform:`rotate(${releaseAngle+1.6}deg)`,offset:.34},
      {transform:`rotate(${releaseAngle-.7}deg)`,offset:.68},
      {transform:`rotate(${releaseAngle}deg)`}
    ],{duration:260,easing:'ease-out'});

    arrowGroup.style.opacity='0';
    hitArrow.style.opacity='1';

    const arrowLen=108;
    let finalTailX,finalTailY,distance;

    if(willHit){
      finalTailX=target.x-ux*(arrowLen-9);
      finalTailY=target.y-uy*(arrowLen-9);
      distance=Math.hypot(finalTailX-start.x,finalTailY-start.y);
    }else{
      const travel=Math.max(innerWidth,innerHeight)*1.15;
      finalTailX=start.x+ux*travel;
      finalTailY=start.y+uy*travel;
      distance=travel;
    }

    const duration=clamp(720-power*310,360,720);
    const from=`translate(${start.x}px,${start.y-12}px) rotate(${shotAngle}deg)`;
    const to=`translate(${finalTailX}px,${finalTailY-12}px) rotate(${shotAngle}deg)`;
    hitArrow.style.transform=from;

    flightAnimation=hitArrow.animate([
      {transform:from,filter:'blur(0px)'},
      {transform:to,filter:power>.72?'blur(.15px)':'blur(0px)'}
    ],{
      duration,
      easing:'cubic-bezier(.16,.72,.18,1)',
      fill:'forwards'
    });

    if(!willHit){
      flightAnimation.finished.then(()=>{
        hitArrow.style.opacity='0';
        later(resetBowForRetry,220);
      }).catch(()=>{});
      return;
    }

    later(()=>{
      // fijamos la flecha visualmente donde terminó para que quede clavada.
      hitArrow.style.transform=to;
      flightAnimation?.cancel?.();
      flightAnimation=null;
      heart.classList.add('hit');
      impactSpark.classList.add('go');
    },duration-15);

    later(()=>{
      heart.classList.add('morph');
      hitArrow.style.opacity='0';
      orb.classList.add('go');
    },duration+500);

    later(()=>{
      wash.classList.add('go');
    },duration+1040);

    later(showScene2,duration+1560);
  }

  function showScene2(){
    scene1.classList.remove('active');
    scene2.classList.add('active');

    later(()=>{
      scene2Flare.classList.add('go');
    },2700);

    later(()=>{
      screenFlash.classList.add('go');
    },3100);

    later(showScene3,3370);
  }

  function heartInside(x,y){
    // Ecuación de corazón normalizada.
    // x alrededor de [-1.15,1.15], y alrededor de [-1.05,1.05]
    const a = x*x + y*y - 1;
    return a*a*a - x*x*y*y*y <= 0;
  }

  function createBlossoms(){
    blossoms.innerHTML='';
    const colors = [
      '#ff3f78','#f92f68','#ff6f91','#ff8dad',
      '#f94f83','#ffa064','#ffbf78','#f76d97',
      '#ffc0cf','#fff0ea','#ff779f','#ec3a73'
    ];

    const W = innerWidth;
    const H = innerHeight;

    // El corazón del follaje queda arriba a la derecha, como en el video.
    const phone = isPhone();
    const cx = phone ? W * .59 : W * .74;
    const cy = phone ? H * .31 : H * .36;
    const rx = phone ? W * .43 : Math.min(W*.27, H*.39);
    const ry = phone ? W * .36 : Math.min(H*.30, W*.22);

    const points = [];
    let tries=0;

    while(points.length < (phone ? 145 : 280) && tries<9000){
      tries++;
      const nx = -1.18 + Math.random()*2.36;
      const ny = -1.08 + Math.random()*2.12;

      // Invertimos Y para que la punta del corazón quede abajo.
      if(heartInside(nx,-ny)){
        // hueco ligero en el centro para que se perciban ramas.
        if(Math.random()<.10 && Math.abs(nx)<.28 && Math.abs(ny)<.25) continue;
        points.push({
          x:cx + nx*rx,
          y:cy + ny*ry,
          d:Math.random()*1.8,
          s:(W<700 ? 7 : 9) + Math.random()*(W<700 ? 15 : 22),
          rot:-30 + Math.random()*60,
          c:colors[Math.floor(Math.random()*colors.length)],
          type:Math.random()>.52?'heart':'dot'
        });
      }
    }

    // Más flores en el cuello donde las ramas se unen.
    for(let i=0;i<32;i++){
      points.push({
        x:(phone ? W*.59 : W*.71) + (Math.random()-.5)*W*(phone ? .18 : .12),
        y:(phone ? H*.52 : H*.57) + (Math.random()-.5)*H*(phone ? .10 : .12),
        d:.2+Math.random()*.9,
        s:9+Math.random()*18,
        rot:-40+Math.random()*80,
        c:colors[Math.floor(Math.random()*colors.length)],
        type:Math.random()>.5?'heart':'dot'
      });
    }

    points
      .sort((a,b)=>a.y-b.y + (Math.random()-.5)*20)
      .forEach((p,i)=>{
        const el=document.createElement('i');
        el.className=`blossom ${p.type}`;
        el.style.left=`${p.x}px`;
        el.style.top=`${p.y}px`;
        el.style.setProperty('--s',`${p.s}px`);
        el.style.setProperty('--rot',`${p.rot}deg`);
        el.style.setProperty('--bc',p.c);
        el.style.setProperty('--bd',`${p.d}s`);
        blossoms.appendChild(el);
      });
  }


  function createFallingPhotos(){
    memoryPhotoNodes.forEach(n=>n.remove());
    memoryPhotoNodes=[];

    /*
      Dos apariciones por cada foto.
      La segunda es más pequeña, más transparente y con mayor desenfoque
      para dar sensación de profundidad.
    */
    const phone = isPhone();
    const total = phone ? 6 : 10;

    for(let i=0;i<total;i++){
      const img=document.createElement('img');

      img.className='memory-photo' + (i >= memoryPhotoSources.length ? ' far' : '');
      img.src=memoryPhotoSources[i % memoryPhotoSources.length];
      img.alt='';

      const far = i >= memoryPhotoSources.length;

      // Repartidas por toda la pantalla para no crear una sola columna.
      const lane = i % 5;
      const baseLeft = [5, 23, 42, 63, 82][lane];
      const jitter = (Math.random() - .5) * 10;

      img.style.setProperty('--left', `${Math.max(1, Math.min(91, baseLeft+jitter))}%`);
      img.style.setProperty('--mw',
        phone
          ? `${64 + Math.random()*30}px`
          : (far
              ? `${72 + Math.random()*45}px`
              : `${100 + Math.random()*58}px`)
      );

      img.style.setProperty('--scale', far ? `${.78 + Math.random()*.12}` : `${.88 + Math.random()*.16}`);

      img.style.setProperty('--r0', `${-14 + Math.random()*28}deg`);
      img.style.setProperty('--r1', `${-8 + Math.random()*16}deg`);
      img.style.setProperty('--r2', `${-18 + Math.random()*36}deg`);

      img.style.setProperty('--drift-mid', `${-38 + Math.random()*76}px`);
      img.style.setProperty('--drift-end', `${-72 + Math.random()*144}px`);

      // Opacidad deliberadamente baja para mantenerlas de fondo.
      img.style.setProperty('--photo-opacity',
        phone
          ? `${.11 + Math.random()*.055}`
          : (far
              ? `${.085 + Math.random()*.045}`
              : `${.15 + Math.random()*.07}`)
      );

      img.style.setProperty('--fall-time',
        far
          ? `${14 + Math.random()*5}s`
          : `${11 + Math.random()*4}s`
      );

      // Algunas comienzan inmediatamente en distintos puntos del ciclo.
      img.style.setProperty('--delay', `${-Math.random()*14}s`);

      memoryRain.appendChild(img);
      memoryPhotoNodes.push(img);
    }
  }

  function createPetals(){
    petalNodes.forEach(n=>n.remove());
    petalNodes=[];

    const petalCount = isPhone() ? 8 : 13;
    for(let i=0;i<petalCount;i++){
      const p=document.createElement('i');
      p.className='petal';
      p.style.left=`${6+Math.random()*90}%`;
      p.style.top=`${-10-Math.random()*30}%`;
      p.style.setProperty('--px',`${-100+Math.random()*200}px`);
      p.style.setProperty('--pd',`${5+Math.random()*5}s`);
      p.style.setProperty('--pdelay',`${Math.random()*4}s`);
      p.style.width=`${6+Math.random()*8}px`;
      p.style.height=`${8+Math.random()*10}px`;
      scene3.appendChild(p);
      petalNodes.push(p);
    }
  }

  function showScene3(){
    scene2.classList.remove('active');
    scene3.classList.add('active');
    scene3.classList.add('grow');
    createBlossoms();
    createFallingPhotos();
    createPetals();

    later(()=>{
      scene3.classList.add('copy-on');
    },640);

    later(()=>{
      document.querySelectorAll('.blossom').forEach(el=>el.classList.add('pop'));
    },1450);

    later(()=>replay.classList.add('show'),3600);
  }

  function reset(){
    clearTimers();

    fired=false;
    aiming=false;
    currentAngle=-24;
    pull=0;
    activePointerId=null;
    flightAnimation?.cancel?.();
    flightAnimation=null;

    replay.classList.remove('show');

    scene1.className='scene active';
    scene2.className='scene';
    scene3.className='scene';

    heart.className='heart-target';
    impactSpark.className='impact-spark';
    orb.className='pink-orb';
    wash.className='wash';
    scene2Flare.className='scene2-flare';
    screenFlash.className='screen-flash';

    hitArrow.style.cssText='';
    hint.style.opacity='1';
    bowRig.style.transition='';
    arrowGroup.style.opacity='1';
    drawStatus.classList.remove('show');

    document.querySelectorAll('.branch').forEach(p=>{
      // reinicia animaciones al volver a aplicar la clase grow
      p.style.animation='none';
      p.offsetHeight;
      p.style.animation='';
    });

    blossoms.innerHTML='';
    petalNodes.forEach(n=>n.remove());
    petalNodes=[];

    memoryPhotoNodes.forEach(n=>n.remove());
    memoryPhotoNodes=[];

    makeImpactSparks();
    initialAim();
  }

  replay.addEventListener('click',reset);

  makeImpactSparks();
  initialAim();

  window.addEventListener('resize',()=>{
    if(!fired && !aiming) initialAim();
  });
})();
</script>
</body>
</html>
