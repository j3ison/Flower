<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Una pequeña sorpresa ♡</title>
<style>
  :root{
    --pink:#ef7792;
    --pink-dark:#ce4f70;
    --pink-soft:#ffd4df;
    --cream:#fff6ec;
    --ink:#542d3b;
    --shadow:rgba(129,65,79,.22);
  }
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0}
  body{
    overflow:hidden;
    font-family:"Courier New", ui-monospace, monospace;
    color:var(--ink);
    background:
      radial-gradient(circle at 15% 25%,rgba(255,181,199,.25),transparent 26%),
      radial-gradient(circle at 80% 75%,rgba(255,220,154,.18),transparent 30%),
      linear-gradient(135deg,#fff2ec 0%,#fff9ee 55%,#fff0e9 100%);
  }

  .scene{
    position:relative;
    width:100%;height:100%;
    min-height:560px;
    display:grid;
    place-items:center;
    isolation:isolate;
  }

  .paper-grain{
    position:absolute; inset:0; pointer-events:none; opacity:.26; z-index:-1;
    background-image:
      radial-gradient(circle, rgba(141,81,80,.16) .65px, transparent .8px),
      radial-gradient(circle, rgba(231,89,121,.15) .65px, transparent .8px);
    background-position:0 0, 17px 19px;
    background-size:31px 37px, 43px 41px;
    mix-blend-mode:multiply;
  }

  /* tiny floating ambient hearts */
  .ambient{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .ambient span{
    position:absolute;
    color:#e85278;
    opacity:.58;
    font-size:clamp(9px,1.15vw,16px);
    animation:ambientFloat var(--d) ease-in-out infinite alternate;
    animation-delay:var(--delay);
  }
  @keyframes ambientFloat{
    from{transform:translate3d(0,0,0) rotate(-8deg)}
    to{transform:translate3d(var(--x),-16px,0) rotate(10deg)}
  }

  /* intro */
  .intro{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:16px;
    z-index:5;
    transition:opacity .6s ease, transform .7s cubic-bezier(.2,.8,.2,1), visibility .6s;
  }
  .intro.hide{opacity:0;transform:scale(.94);visibility:hidden;pointer-events:none}

  .envelope-wrap{position:relative;width:180px;height:130px;display:grid;place-items:center;margin-bottom:8px}
  .envelope{
    position:relative;width:150px;height:96px;
    background:#fff7f5;border:3px solid #d76d86;border-radius:3px;
    filter:drop-shadow(0 9px 9px rgba(166,87,100,.13));
    transform-origin:center;
  }
  .envelope:before,.envelope:after{content:"";position:absolute;inset:0;pointer-events:none}
  .envelope:before{
    clip-path:polygon(0 0,50% 59%,100% 0);
    background:#f3a0b4;
    border-bottom:2px solid #d76d86;
  }
  .envelope:after{
    clip-path:polygon(0 100%,0 31%,50% 75%,100% 31%,100% 100%);
    background:linear-gradient(135deg,#fff9f7 0 49%,#f6d9dd 50% 51%,#fff9f7 52%);
  }
  .seal{
    position:absolute;left:50%;top:53%;z-index:3;transform:translate(-50%,-50%);
    color:#ef3869;font-size:25px;text-shadow:0 1px #fff;
  }
  .intro.shot .envelope{animation:hit .52s ease .34s both}
  @keyframes hit{0%{transform:rotate(0)}30%{transform:rotate(-6deg) scale(1.04)}60%{transform:rotate(5deg)}100%{transform:rotate(0) scale(.97)}}

  .surprise{font-size:15px;font-weight:700;letter-spacing:.2px;text-shadow:0 1px #fff}
  .surprise .heart{color:#dd3d67}

  .archery{
    height:150px;width:260px;position:relative;display:grid;place-items:center;
    user-select:none;touch-action:none;cursor:pointer;
    filter:drop-shadow(0 7px 7px rgba(111,61,25,.12));
  }
  .archery-svg{width:250px;height:145px;overflow:visible}
  .bow-limb{
    transform-box:fill-box;transform-origin:center bottom;
    transition:transform .22s cubic-bezier(.2,.8,.2,1),filter .22s ease;
  }
  .bow-string{transition:opacity .16s ease}
  .string-charged{opacity:0}
  .arrow-group{
    transform-box:fill-box;transform-origin:center center;
    transition:transform .23s cubic-bezier(.2,.8,.2,1),filter .2s ease;
  }
  .archery.charging .bow-limb{transform:scaleX(.965) translateY(1px);filter:drop-shadow(0 2px 2px rgba(99,51,18,.2))}
  .archery.charging .string-rest{opacity:0}
  .archery.charging .string-charged{opacity:1}
  .archery.charging .arrow-group{
    transform:translateY(24px);
    filter:drop-shadow(0 0 5px rgba(227,64,103,.48));
  }
  .archery.charging .nock-glow{animation:nockGlow .42s ease-in-out infinite alternate}
  @keyframes nockGlow{to{opacity:1;transform:scale(1.35)}}
  .intro.shot .arrow-group{animation:arrowFly .52s cubic-bezier(.16,.78,.24,1) forwards}
  .intro.shot .bow-limb{animation:bowRelease .34s ease-out}
  @keyframes arrowFly{
    0%{transform:translateY(20px);opacity:1}
    72%{opacity:1}
    100%{transform:translateY(-235px);opacity:0}
  }
  @keyframes bowRelease{0%{transform:scaleX(.965)}45%{transform:scaleX(1.03)}100%{transform:scaleX(1)}}

  .hint{font-size:12px;opacity:.78;text-align:center;margin-top:-5px}
  .hint strong{color:#d64168}

  /* window */
  .love-window{
    position:relative;
    width:min(390px,86vw);
    height:min(470px,74vh);
    min-height:390px;
    background:#f8b4c6;
    border:3px solid #dc6b86;
    box-shadow:0 18px 34px var(--shadow),0 0 0 3px rgba(255,255,255,.35) inset;
    border-radius:8px;
    opacity:0; visibility:hidden;
    transform:scale(.48) translateY(35px);
    z-index:4;
    overflow:hidden;
    transition:opacity .45s ease, transform .58s cubic-bezier(.18,.92,.28,1.12), visibility .45s;
  }
  .love-window.open{opacity:1;visibility:visible;transform:scale(1) translateY(0)}
  .love-window.win{animation:windowGlow 1.4s ease-in-out infinite alternate}
  @keyframes windowGlow{to{box-shadow:0 18px 38px rgba(199,76,105,.24),0 0 32px rgba(250,96,137,.38)}}

  .titlebar{height:39px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-bottom:3px solid #d86a83;background:#f596ad;font-weight:900;font-size:14px;letter-spacing:.7px}
  .win-controls{display:flex;gap:5px}
  .win-controls i{display:grid;place-items:center;width:16px;height:16px;background:#fff2f1;border:1px solid #da7d90;border-radius:2px;font-style:normal;font-size:10px;color:#bc6377;line-height:1}
  .toolbar{height:31px;background:#ffd7df;border-bottom:3px solid #df7e94;display:flex;align-items:center;justify-content:center;gap:14px;color:#df416b;font-size:13px;font-weight:bold}
  .toolbar span{animation:hintPulse 1.3s ease-in-out infinite}.toolbar span:nth-child(2){animation-delay:.2s}.toolbar span:nth-child(3){animation-delay:.4s}
  @keyframes hintPulse{50%{opacity:.38;transform:scale(.82)}}

  .content{
    position:relative;height:calc(100% - 70px);overflow:hidden;
    display:flex;flex-direction:column;align-items:center;
    background-color:#f9b8c9;
    background-image:
      linear-gradient(rgba(255,255,255,.34) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.34) 1px,transparent 1px),
      linear-gradient(rgba(205,85,116,.12) 1px,transparent 1px),
      linear-gradient(90deg,rgba(205,85,116,.12) 1px,transparent 1px);
    background-size:12px 12px,12px 12px,36px 36px,36px 36px;
    padding:20px 14px 12px;
  }

  .question,.win-message{
    margin:0;text-align:center;font-weight:900;font-size:clamp(17px,4vw,22px);line-height:1.28;
    letter-spacing:.1px;text-shadow:1px 1px 0 rgba(255,255,255,.55);z-index:4;
  }
  .win-message{display:none;font-size:clamp(20px,5vw,28px);margin-top:2px}

  .cat-wrap{width:160px;height:170px;display:grid;place-items:center;position:relative;z-index:3;margin:3px 0 2px;animation:catIdle 1.8s ease-in-out infinite}
  @keyframes catIdle{50%{transform:translateY(-4px)}}
  .cat-svg{width:145px;height:155px;image-rendering:pixelated;shape-rendering:crispEdges;filter:drop-shadow(0 3px 0 rgba(135,55,75,.18))}
  .cat-heart{transform-origin:center;animation:beat .9s ease-in-out infinite}
  @keyframes beat{50%{transform:scale(1.12)}}
  .love-window.win .cat-wrap{animation:happyCat .75s ease-in-out infinite alternate}
  @keyframes happyCat{from{transform:rotate(-5deg) translateY(0)}to{transform:rotate(5deg) translateY(-7px)}}

  .actions{position:relative;width:100%;height:72px;margin-top:auto;z-index:10}
  button{
    position:absolute;top:8px;
    border:2px solid #d66580;background:#fff8f5;color:#8d3b51;
    border-radius:3px;padding:9px 17px;font-family:inherit;font-weight:900;font-size:14px;letter-spacing:.4px;
    box-shadow:0 4px 0 rgba(186,74,100,.18);cursor:pointer;
    transition:left .26s cubic-bezier(.2,.8,.2,1),top .26s cubic-bezier(.2,.8,.2,1),transform .25s ease,background .2s,color .2s,padding .25s,font-size .25s;
  }
  button:active{box-shadow:0 1px 0 rgba(186,74,100,.2);transform:translateY(2px)}
  #yesBtn{left:calc(50% - 84px)}
  #noBtn{left:calc(50% + 14px)}
  #yesBtn.grow{background:#ed426d;color:white;border-color:#cf365b;box-shadow:0 5px 0 #c63155,0 9px 16px rgba(193,49,82,.2)}

  .replay{
    display:none;position:absolute!important;left:50%!important;top:auto!important;bottom:18px!important;transform:translateX(-50%)!important;
    background:#fff7f4;padding:7px 12px;font-size:12px;z-index:12;
  }
  .win .replay{display:block}

  .burst{position:absolute;inset:0;z-index:7;pointer-events:none;overflow:hidden}
  .flying-heart{
    position:absolute;left:50%;top:62%;font-size:var(--s);color:var(--c);opacity:0;
    filter:drop-shadow(0 2px 1px rgba(149,51,80,.18));
    animation:burstHeart var(--t) cubic-bezier(.12,.7,.26,1) forwards;
  }
  @keyframes burstHeart{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(0)}
    10%{opacity:1}
    75%{opacity:.95}
    100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.15) rotate(var(--r))}
  }

  .sparkle{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.8;animation:sparkle 1.1s ease-in-out infinite alternate;pointer-events:none}
  @keyframes sparkle{to{transform:scale(.25);opacity:.2}}

  @media(max-height:610px){
    .love-window{height:86vh;min-height:355px}
    .content{padding-top:12px}.cat-wrap{height:140px}.cat-svg{height:132px}.actions{height:58px}
  }
  @media(max-width:450px){
    .love-window{width:88vw}.titlebar{height:36px}.toolbar{height:29px}.content{height:calc(100% - 65px)}
  }
  @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="scene" id="scene">
  <div class="paper-grain"></div>
  <div class="ambient" id="ambient"></div>

  <section class="intro" id="intro" aria-label="Abrir la sorpresa">
    <div class="envelope-wrap">
      <div class="envelope"><span class="seal">♥</span></div>
    </div>
    <div class="surprise"><span class="heart">♥</span> Una pequeña sorpresa <span class="heart">♥</span></div>
    <div class="archery" id="archery" role="button" tabindex="0" aria-label="Mantén presionado y suelta para disparar la flecha">
      <svg class="archery-svg" viewBox="0 0 260 150" aria-hidden="true">
        <defs>
          <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#6f3519"/>
            <stop offset=".45" stop-color="#b76d34"/>
            <stop offset=".72" stop-color="#8b471f"/>
            <stop offset="1" stop-color="#5f2c16"/>
          </linearGradient>
          <linearGradient id="woodGlow" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#d99a55" stop-opacity=".25"/>
            <stop offset=".5" stop-color="#ffd69b" stop-opacity=".82"/>
            <stop offset="1" stop-color="#d99a55" stop-opacity=".22"/>
          </linearGradient>
          <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fff1f4"/>
            <stop offset=".35" stop-color="#b7a4aa"/>
            <stop offset="1" stop-color="#6f6067"/>
          </linearGradient>
          <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
            <feDropShadow dx="0" dy="3" stdDeviation="2.2" flood-color="#5d2e20" flood-opacity=".24"/>
          </filter>
        </defs>

        <!-- arco de madera -->
        <g class="bow-limb" filter="url(#softShadow)">
          <path d="M38 112 Q130 28 222 112" fill="none" stroke="#5f2c16" stroke-width="12" stroke-linecap="round"/>
          <path d="M38 112 Q130 28 222 112" fill="none" stroke="url(#wood)" stroke-width="8" stroke-linecap="round"/>
          <path d="M45 106 Q130 38 215 106" fill="none" stroke="url(#woodGlow)" stroke-width="2.3" stroke-linecap="round"/>
          <path d="M116 50 Q130 38 144 50" fill="none" stroke="#5b2b17" stroke-width="7" stroke-linecap="round"/>
          <path d="M119 50 Q130 43 141 50" fill="none" stroke="#c98548" stroke-width="2.2" stroke-linecap="round"/>
        </g>

        <!-- cuerda normal / tensada -->
        <path class="bow-string string-rest" d="M40 111 Q130 90 220 111" fill="none" stroke="#6d5550" stroke-width="1.8"/>
        <path class="bow-string string-charged" d="M40 111 L130 129 L220 111" fill="none" stroke="#5c4642" stroke-width="1.8"/>

        <!-- flecha -->
        <g class="arrow-group">
          <line x1="130" y1="109" x2="130" y2="26" stroke="#74463a" stroke-width="3.4" stroke-linecap="round"/>
          <line x1="128.8" y1="107" x2="128.8" y2="29" stroke="#ca8a70" stroke-width="1" stroke-linecap="round" opacity=".85"/>
          <path d="M130 13 L121 31 L130 27 L139 31 Z" fill="url(#metal)" stroke="#6e5f65" stroke-width="1"/>
          <path d="M129 102 L116 110 L129 113 Z" fill="#e95075"/>
          <path d="M131 102 L144 110 L131 113 Z" fill="#f2869e"/>
          <rect x="126" y="108" width="8" height="5" rx="2" fill="#5f403b"/>
          <circle class="nock-glow" cx="130" cy="110" r="4" fill="#ff6d91" opacity=".18" style="transform-origin:130px 110px"/>
        </g>
      </svg>
    </div>
    <div class="hint">Mantén presionado para tensar el arco — suelta para disparar <strong>♡</strong></div>
  </section>

  <section class="love-window" id="loveWindow" aria-live="polite">
    <div class="titlebar">
      <span>AMOR</span>
      <div class="win-controls"><i>–</i><i>□</i><i>×</i></div>
    </div>
    <div class="toolbar"><span>♥</span><span>♥</span><span>♥</span></div>
    <div class="content" id="content">
      <p class="question" id="question">Feliz primer mes, mi<br>amor ♡ ¿Todavía me amas?</p>
      <p class="win-message" id="winMessage">¡Siii! Sabía que sí ♡</p>

      <div class="cat-wrap">
        <svg class="cat-svg" viewBox="0 0 150 160" aria-label="Gatito negro pixelado sosteniendo un corazón">
          <!-- ears -->
          <rect x="24" y="20" width="16" height="16" fill="#1f1b20"/><rect x="32" y="12" width="16" height="16" fill="#1f1b20"/>
          <rect x="102" y="20" width="16" height="16" fill="#1f1b20"/><rect x="94" y="12" width="16" height="16" fill="#1f1b20"/>
          <rect x="32" y="20" width="8" height="8" fill="#f38ba4"/><rect x="102" y="20" width="8" height="8" fill="#f38ba4"/>
          <!-- head/body pixel silhouette -->
          <rect x="24" y="28" width="94" height="70" fill="#1f1b20"/>
          <rect x="32" y="92" width="78" height="34" fill="#1f1b20"/>
          <rect x="21" y="62" width="18" height="46" fill="#1f1b20"/><rect x="103" y="62" width="18" height="46" fill="#1f1b20"/>
          <rect x="30" y="118" width="32" height="18" fill="#1f1b20"/><rect x="82" y="118" width="32" height="18" fill="#1f1b20"/>
          <!-- face -->
          <rect x="41" y="49" width="24" height="27" fill="#fff7f4"/><rect x="79" y="49" width="24" height="27" fill="#fff7f4"/>
          <rect x="48" y="55" width="9" height="17" fill="#1f1b20"/><rect x="86" y="55" width="9" height="17" fill="#1f1b20"/>
          <rect x="68" y="77" width="9" height="7" fill="#f68aa4"/>
          <!-- heart -->
          <g class="cat-heart">
            <rect x="59" y="94" width="12" height="12" fill="#ef416c"/><rect x="76" y="94" width="12" height="12" fill="#ef416c"/>
            <rect x="53" y="100" width="41" height="18" fill="#ef416c"/><rect x="59" y="118" width="29" height="12" fill="#ef416c"/><rect x="65" y="130" width="17" height="8" fill="#ef416c"/>
          </g>
        </svg>
      </div>

      <div class="actions" id="actions">
        <button id="yesBtn">SÍ</button>
        <button id="noBtn">NO</button>
      </div>
      <button class="replay" id="replay">Repetir ↻</button>
      <div class="burst" id="burst"></div>
    </div>
  </section>
</main>

<script>
(() => {
  const intro = document.getElementById('intro');
  const archery = document.getElementById('archery');
  const loveWindow = document.getElementById('loveWindow');
  const yesBtn = document.getElementById('yesBtn');
  const noBtn = document.getElementById('noBtn');
  const actions = document.getElementById('actions');
  const content = document.getElementById('content');
  const question = document.getElementById('question');
  const winMessage = document.getElementById('winMessage');
  const burst = document.getElementById('burst');
  const replay = document.getElementById('replay');
  const ambient = document.getElementById('ambient');

  let charged = false;
  let opened = false;
  let noRuns = 0;
  let yesScale = 1;

  // Ambient tiny hearts
  for (let i = 0; i < 22; i++) {
    const h = document.createElement('span');
    h.textContent = Math.random() > .45 ? '♥' : '♡';
    h.style.left = `${4 + Math.random() * 92}%`;
    h.style.top = `${4 + Math.random() * 90}%`;
    h.style.setProperty('--d', `${2.3 + Math.random() * 3}s`);
    h.style.setProperty('--delay', `${-Math.random() * 4}s`);
    h.style.setProperty('--x', `${-14 + Math.random() * 28}px`);
    h.style.opacity = (.18 + Math.random() * .4).toFixed(2);
    ambient.appendChild(h);
  }

  function beginCharge(){
    if (opened) return;
    charged = true;
    archery.classList.add('charging');
  }

  function releaseShot(){
    if (!charged || opened) return;
    charged = false;
    opened = true;
    archery.classList.remove('charging');
    intro.classList.add('shot');
    setTimeout(() => {
      intro.classList.add('hide');
      loveWindow.classList.add('open');
    }, 560);
  }

  archery.addEventListener('pointerdown', beginCharge);
  window.addEventListener('pointerup', releaseShot);
  archery.addEventListener('keydown', e => {
    if ((e.key === ' ' || e.key === 'Enter') && !opened) {
      e.preventDefault();
      beginCharge();
      setTimeout(releaseShot, 280);
    }
  });

  // Make it easy on mobile: a normal tap also works even if pointerup timing is tiny.
  archery.addEventListener('click', () => {
    if (!opened) { beginCharge(); setTimeout(releaseShot, 180); }
  });

  function runAway(){
    if (loveWindow.classList.contains('win')) return;
    const box = actions.getBoundingClientRect();
    const b = noBtn.getBoundingClientRect();
    const maxX = Math.max(4, box.width - b.width - 4);
    const maxY = Math.max(2, box.height - b.height - 2);

    let x = Math.random() * maxX;
    let y = Math.random() * maxY;
    // Try not to land too close to YES.
    const yesRect = yesBtn.getBoundingClientRect();
    const candidateX = box.left + x;
    if (Math.abs(candidateX - yesRect.left) < 80) x = candidateX < yesRect.left ? 2 : maxX;

    noBtn.style.left = `${x}px`;
    noBtn.style.top = `${y}px`;

    noRuns++;
    yesScale = Math.min(2.05, 1 + noRuns * .18);
    yesBtn.classList.add('grow');
    yesBtn.style.transform = `scale(${yesScale})`;
    yesBtn.style.zIndex = 5;
  }

  ['pointerenter','pointerdown','touchstart'].forEach(evt => noBtn.addEventListener(evt, e => {
    if (evt !== 'pointerenter') e.preventDefault();
    runAway();
  }, {passive:false}));

  // Also dodge when cursor gets close to the NO button, similar to the video.
  content.addEventListener('pointermove', e => {
    if (loveWindow.classList.contains('win')) return;
    const r = noBtn.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    if (Math.hypot(e.clientX - cx, e.clientY - cy) < 48) runAway();
  });

  function heartBurst(){
    burst.innerHTML = '';
    const colors = ['#ed426d','#ff6f91','#f8a3b8','#f6bf4f','#d93d72','#ff8fb1'];
    for (let i = 0; i < 48; i++) {
      const h = document.createElement('span');
      h.className = 'flying-heart';
      h.textContent = Math.random() > .18 ? '♥' : '♡';
      const angle = Math.random() * Math.PI * 2;
      const distance = 90 + Math.random() * 310;
      h.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
      h.style.setProperty('--dy', `${Math.sin(angle) * distance - 65}px`);
      h.style.setProperty('--r', `${-120 + Math.random() * 240}deg`);
      h.style.setProperty('--s', `${14 + Math.random() * 30}px`);
      h.style.setProperty('--c', colors[Math.floor(Math.random() * colors.length)]);
      h.style.setProperty('--t', `${1.25 + Math.random() * 1.15}s`);
      h.style.animationDelay = `${Math.random() * .22}s`;
      burst.appendChild(h);
    }
  }

  yesBtn.addEventListener('click', () => {
    if (loveWindow.classList.contains('win')) return;
    loveWindow.classList.add('win');
    question.style.display = 'none';
    winMessage.style.display = 'block';
    actions.style.display = 'none';
    heartBurst();
    setTimeout(heartBurst, 720);
  });

  replay.addEventListener('click', () => {
    loveWindow.classList.remove('open','win');
    question.style.display = '';
    winMessage.style.display = 'none';
    actions.style.display = '';
    yesBtn.classList.remove('grow');
    yesBtn.style.transform = '';
    noBtn.style.left = '';
    noBtn.style.top = '';
    burst.innerHTML = '';
    noRuns = 0; yesScale = 1; opened = false; charged = false;
    intro.classList.remove('hide','shot');
    setTimeout(() => {}, 20);
  });

  // Subtle sparkles around the window
  for (let i = 0; i < 8; i++) {
    const s = document.createElement('i'); s.className = 'sparkle';
    s.style.left = `${5 + Math.random() * 90}%`; s.style.top = `${8 + Math.random() * 80}%`;
    s.style.animationDelay = `${Math.random()}s`; content.appendChild(s);
  }
})();
</script>
</body>
</html>
